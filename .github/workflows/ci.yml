name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - name: Installer runs nothing when cut off
        run: bash tests/install-truncation.sh
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The native build, and the determinism tests that replay recorded games through it. The tests
  # need the shareware episode, which is not in the repository: set the repository variable
  # KEEN_SHAREWARE_URL to a zip that holds it and they run; without it only the build is checked.
  # Either the Internet Archive zip (plain files in a CKeen1/ folder) or Apogee's `1keen.zip`
  # (with CK1SW131.SHR) will do. The WebAssembly build is not made here; release.yml does that.
  game:
    name: Game
    runs-on: ubuntu-latest
    env:
      KEEN_SHAREWARE_URL: ${{ vars.KEEN_SHAREWARE_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev
      - run: make
      - name: Fetch the shareware data
        if: env.KEEN_SHAREWARE_URL != ''
        run: |
          curl -fsSL "$KEEN_SHAREWARE_URL" -o /tmp/1keen.zip
          unzip -q /tmp/1keen.zip -d /tmp/1keen
          mkdir -p shareware/data
          shr="$(find /tmp/1keen -iname 'CK1SW131.SHR' | head -n1)"
          if [ -n "$shr" ]; then
            python3 tools/unshr.py "$shr" shareware/data
          else
            # Plain files in any folder. The saved games and the settings of whoever packed
            # the zip are left out, as the game makes its own.
            find /tmp/1keen -type f \( -iname '*.CK1' -o -iname 'KEEN1.EXE' \) \
              ! -iname 'SAVED*' ! -iname 'CTLPANEL.CK1' ! -iname 'SCORES.CK1' \
              -exec cp {} shareware/data/ \;
          fi
          test -f shareware/data/EGAHEAD.CK1 && test -f shareware/data/KEEN1.EXE
      - name: Replay determinism tests
        if: env.KEEN_SHAREWARE_URL != ''
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy sh tests/run.sh
      - name: Say why the tests did not run
        if: env.KEEN_SHAREWARE_URL == ''
        run: echo "::notice::KEEN_SHAREWARE_URL is not set, so the replay determinism tests were skipped"
